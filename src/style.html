<style>
:root{--bg:#f6f7fb;--fg:#1d2433;--card:#fff;--line:#e2e6ef;--accent:#2f6fed;--muted:#6b7488}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ecf5;--card:#1b2030;--line:#2a3144;--accent:#6c9bff;--muted:#98a2b8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:0 0 auto}
#q{flex:1;min-width:160px;max-width:420px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#me{margin-left:auto;font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;padding:8px 20px 0}
nav button{border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px}
nav button.on{color:var(--accent);border-color:var(--accent)}
main{padding:16px 20px;max-width:1200px;margin:0 auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:inherit;text-decoration:none;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:28px}.card h3{margin:8px 0 4px;font-size:15px}
.card p{margin:0;font-size:12px;color:var(--muted)}
.star{position:absolute;top:8px;right:10px;background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted)}
.star.on{color:#f5b301}
#cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.note.warn{border-left-color:#e8a100}.note.alert{border-left-color:#d93636}
.note b{display:block}.note small{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;margin-bottom:24px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
input,select,textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.btn{padding:6px 12px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.btn.sub{background:var(--line);color:var(--fg)}
form.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
h2{font-size:15px}
</style>
