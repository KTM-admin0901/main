<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run = (fn, ...args) => new Promise((ok, ng) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(e => { toast(e.message || e); ng(e); })[fn](...args));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

let S = null, cat = '全て';

async function init() {
  S = await run('api_bootstrap');
  document.title = S.title;
  $('#title').textContent = S.title;
  $('#me').textContent = S.user.name + '(' + S.user.role + ')';
  $('#adminTab').hidden = !S.isAdmin;
  $('#q').oninput = renderApps;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  renderAnnouncements(); renderApps();
}

function showTab(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#home').hidden = t !== 'home'; $('#docs').hidden = t !== 'docs'; $('#admin').hidden = t !== 'admin';
  if (t === 'admin') loadAdmin();
  if (t === 'docs') renderDocs();
}

function renderAnnouncements() {
  $('#announce').innerHTML = S.announcements.map(a =>
    `<div class="note ${esc(a.level)}"><b>${esc(a.title)}</b>${esc(a.body)}<br><small>${esc(String(a.publishedAt).slice(0,10))}</small></div>`).join('');
}

function renderApps() {
  const q = $('#q').value.trim().toLowerCase();
  const cats = ['全て', '★お気に入り', ...new Set(S.apps.map(a => a.category).filter(Boolean))];
  $('#cats').innerHTML = cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('#cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.c; renderApps(); });
  const list = S.apps.filter(a =>
    (cat === '全て' || (cat === '★お気に入り' ? S.favorites.includes(String(a.id)) : a.category === cat)) &&
    (!q || (a.name + a.description + a.category).toLowerCase().includes(q)));
  $('#grid').innerHTML = list.map(a => {
    const fav = S.favorites.includes(String(a.id));
    return `<a class="card" href="${esc(a.url)}" data-id="${esc(a.id)}" rel="noopener">
      <button class="star ${fav ? 'on' : ''}" data-id="${esc(a.id)}" title="お気に入り">${fav ? '★' : '☆'}</button>
      <div class="ic">${esc(a.icon || '📦')}</div><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p>${a.type === 'package' ? '<p><span class="chip">PCインストール型</span></p>' : ''}</a>`;
  }).join('') || '<p>該当するアプリがありません</p>';
  $('#grid').querySelectorAll('.card').forEach(c => c.addEventListener('click', e => {
    if (e.target.classList.contains('star')) return;
    run('api_logLaunch', c.dataset.id).catch(() => {});
  }));
  $('#grid').querySelectorAll('.star').forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    const on = await run('api_toggleFavorite', b.dataset.id);
    const id = b.dataset.id;
    S.favorites = on ? [...S.favorites, id] : S.favorites.filter(x => x !== id);
    renderApps();
  });
}

// ---- 資料・展望 ----
const PHASES = ['構想', '設計', '開発', '稼働'];
const KINDS = ['設計書', '要件定義', 'ロードマップ', '構成図', '議事録', 'マニュアル', 'その他'];
let dFilter = { system: '', kind: '', q: '' };
const sysName = id => (S.systems.find(s => String(s.id) === String(id)) || {}).name || '(未分類)';
const opts = (arr, sel) => arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

function renderDocs() {
  const roadmap = PHASES.map(p => `<div class="col"><h2>${p}</h2>` +
    (S.systems.filter(s => s.phase === p).map(s => `
      <div class="sys ${dFilter.system === String(s.id) ? 'on' : ''}" data-sys="${esc(s.id)}">
        <b>${esc(s.name)}</b><br><small>${esc(String(s.targetDate || '').slice(0, 10))} ${esc(s.owner)}</small>
        <p>${esc(s.summary)}</p><small>資料 ${S.documents.filter(d => String(d.systemId) === String(s.id)).length}件</small>
        ${S.canEdit ? ` <a href="#" data-editsys="${esc(s.id)}">編集</a>` : ''}
        ${S.isAdmin ? ` <a href="#" data-delsys="${esc(s.id)}">削除</a>` : ''}</div>`).join('') || '<small>なし</small>') + '</div>').join('');

  const q = dFilter.q.toLowerCase();
  const docs = S.documents.filter(d =>
    (!dFilter.system || String(d.systemId) === dFilter.system) && (!dFilter.kind || d.kind === dFilter.kind) &&
    (!q || (d.title + d.summary + d.tags).toLowerCase().includes(q)));

  $('#docs').innerHTML = `
    <h2>展望(構築予定システム)</h2><div class="road">${roadmap}</div>
    ${S.canEdit ? `
    <details><summary>システムを登録</summary>
    <form class="row" id="fSys"><input type="hidden" name="id">
      <input name="name" placeholder="システム名" required>
      <select name="phase">${opts(PHASES)}</select>
      <input name="targetDate" placeholder="予定時期 例 2026-12 / 2026年Q4" size="22">
      <input name="owner" placeholder="担当"><input name="summary" placeholder="概要・狙い" size="40">
      <select name="minRole"><option>member</option><option>manager</option><option>admin</option></select>
      <input name="sortOrder" type="number" placeholder="順" style="width:70px"><button class="btn">保存</button></form></details>
    <details><summary>資料を登録</summary>
    <form class="row" id="fDoc"><input type="hidden" name="id">
      <input name="title" placeholder="タイトル" required>
      <select name="kind">${opts(KINDS)}</select>
      <select name="systemId"><option value="">(関連システムなし)</option>${S.systems.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
      <input name="url" placeholder="https://… (Googleドキュメント/Drive等の共有リンク)" size="40" required>
      <input name="version" placeholder="版" size="6"><input name="tags" placeholder="タグ(カンマ区切り)">
      <input name="summary" placeholder="要約" size="40">
      <select name="minRole"><option>member</option><option>manager</option><option>admin</option></select>
      <select name="status"><option value="active">公開</option><option value="hidden">非公開</option></select>
      <button class="btn">保存</button></form></details>` : ''}
    <h2>資料一覧${dFilter.system ? '(' + esc(sysName(dFilter.system)) + ')' : ''}</h2>
    <form class="row" onsubmit="return false"><input id="dq" placeholder="検索" value="${esc(dFilter.q)}">
      <select id="dk"><option value="">全種別</option>${opts(KINDS, dFilter.kind)}</select>
      <button type="button" class="btn sub" id="dclr">絞り込み解除</button></form>
    <table><tr><th>タイトル</th><th>種別</th><th>システム</th><th>版</th><th>更新</th><th>要約</th><th></th></tr>
    ${docs.map(d => `<tr><td><a href="${esc(d.url)}" rel="noopener">${esc(d.title)}</a>${d.status === 'hidden' ? ' 🔒' : ''}</td>
      <td>${esc(d.kind)}</td><td>${esc(sysName(d.systemId))}</td><td>${esc(d.version)}</td>
      <td>${esc(String(d.updatedAt).slice(0, 10))}</td><td>${esc(d.summary)}</td>
      <td>${S.canEdit ? `<a href="#" data-editdoc="${esc(d.id)}">編集</a>` : ''} ${S.isAdmin ? `<a href="#" data-deldoc="${esc(d.id)}">削除</a>` : ''}</td></tr>`).join('') || '<tr><td colspan="7">資料がありません</td></tr>'}</table>`;

  const el = $('#docs');
  el.querySelectorAll('[data-sys]').forEach(b => b.onclick = e => {
    if (e.target.tagName === 'A') return;
    dFilter.system = dFilter.system === b.dataset.sys ? '' : b.dataset.sys; renderDocs();
  });
  $('#dq').oninput = e => { dFilter.q = e.target.value; const pos = e.target.selectionStart; renderDocs(); const n = $('#dq'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#dk').onchange = e => { dFilter.kind = e.target.value; renderDocs(); };
  $('#dclr').onclick = () => { dFilter = { system: '', kind: '', q: '' }; renderDocs(); };

  const fill = (formId, obj) => { const f = $(formId); f.closest('details').open = true;
    [...f.elements].forEach(x => { if (x.name && obj[x.name] !== undefined) x.value = obj[x.name]; }); f.scrollIntoView(); };
  const save = (formId, fn) => { const f = $(formId); if (!f) return; f.onsubmit = async e => {
    e.preventDefault(); await run(fn, Object.fromEntries(new FormData(f))); toast('保存しました');
    S = await run('api_bootstrap'); renderDocs(); }; };
  save('#fSys', 'api_saveSystem'); save('#fDoc', 'api_saveDocument');
  el.querySelectorAll('[data-editsys]').forEach(a => a.onclick = e => { e.preventDefault(); fill('#fSys', S.systems.find(s => String(s.id) === a.dataset.editsys)); });
  el.querySelectorAll('[data-editdoc]').forEach(a => a.onclick = e => { e.preventDefault(); fill('#fDoc', S.documents.find(d => String(d.id) === a.dataset.editdoc)); });
  const del = (sel, attr, fn, msg) => el.querySelectorAll(sel).forEach(a => a.onclick = async e => {
    e.preventDefault(); if (!confirm(msg)) return; await run(fn, a.dataset[attr]); S = await run('api_bootstrap'); renderDocs(); });
  del('[data-delsys]', 'delsys', 'api_deleteSystem', 'このシステムを削除しますか?(資料は残ります)');
  del('[data-deldoc]', 'deldoc', 'api_deleteDocument', 'この資料を削除しますか?');
}

// ---- 管理画面 ----
async function loadAdmin() {
  const d = await run('api_admin_load');
  $('#admin').innerHTML = `
    <p><button class="btn sub" id="bSync">標準アプリ(在庫管理・CAD案内)を登録/更新</button></p>
    <h2>アプリ登録</h2>
    <form class="row" id="fApp">
      <select name="type"><option value="web">Webアプリ</option><option value="package">パッケージ型(PCインストール)</option></select>
      <input name="name" placeholder="名称" required><input name="url" placeholder="URL(Webは必須/パッケージは任意の案内ページ)" size="36">
      <input name="category" placeholder="カテゴリ"><input name="icon" placeholder="絵文字" size="4">
      <input name="description" placeholder="説明" size="28">
      <select name="minRole"><option>member</option><option>manager</option><option>admin</option></select>
      <input name="sortOrder" type="number" placeholder="順" style="width:70px">
      <input name="version" placeholder="バージョン(パッケージ)" size="14"><input name="downloadUrl" placeholder="配布先URL https://…" size="30">
      <input name="requirements" placeholder="動作要件" size="30"><input name="command" placeholder="起動コマンド" size="24">
      <textarea name="installGuide" rows="3" cols="50" placeholder="インストール手順(1行1手順)"></textarea>
      <button class="btn">保存</button></form>
    <table><tr><th>名称</th><th>種別</th><th>URL</th><th>カテゴリ</th><th>権限</th><th>状態</th><th></th></tr>
    ${d.apps.map(a => `<tr><td>${esc(a.icon)} ${esc(a.name)}</td><td>${esc(a.type || 'web')}</td><td>${esc(a.url)}</td><td>${esc(a.category)}</td><td>${esc(a.minRole)}</td><td>${esc(a.status)}</td>
      <td><button class="btn sub" data-toggle="${esc(a.id)}">${a.status === 'active' ? '非表示' : '表示'}</button>
      <button class="btn sub" data-del="${esc(a.id)}">削除</button></td></tr>`).join('')}</table>
    <h2>ユーザー登録</h2>
    <form class="row" id="fUser"><input name="email" type="email" placeholder="メール" required><input name="name" placeholder="氏名">
      <input name="department" placeholder="部署"><select name="role"><option>member</option><option>manager</option><option>admin</option></select>
      <label><input type="checkbox" name="active" checked> 有効</label><button class="btn">保存</button></form>
    <table><tr><th>メール</th><th>氏名</th><th>部署</th><th>権限</th><th>有効</th></tr>
    ${d.users.map(u => `<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.department)}</td><td>${esc(u.role)}</td><td>${esc(u.active)}</td></tr>`).join('')}</table>
    <h2>お知らせ投稿</h2>
    <form class="row" id="fAnn"><input name="title" placeholder="タイトル" required><input name="body" placeholder="本文" size="40">
      <select name="level"><option value="info">info</option><option value="warn">warn</option><option value="alert">alert</option></select>
      <input name="expiresAt" type="date"><button class="btn">投稿</button></form>`;

  const form = (id, fn, after) => $(id).onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(e.target));
    if (e.target.active !== undefined) o.active = e.target.active.checked;
    await run(fn, o); toast('保存しました'); await after();
  };
  const refresh = async () => { S = await run('api_bootstrap'); renderApps(); renderAnnouncements(); loadAdmin(); };
  $('#bSync').onclick = async () => { await run('api_admin_syncApps'); toast('登録しました'); refresh(); };
  form('#fApp', 'api_admin_saveApp', refresh);
  form('#fUser', 'api_admin_saveUser', loadAdmin);
  form('#fAnn', 'api_admin_saveAnnouncement', refresh);
  $('#admin').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirm('削除しますか?')) { await run('api_admin_deleteApp', b.dataset.del); refresh(); }
  });
  $('#admin').querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const a = d.apps.find(x => String(x.id) === b.dataset.toggle);
    a.status = a.status === 'active' ? 'hidden' : 'active';
    await run('api_admin_saveApp', a); refresh();
  });
}

init();
</script>
